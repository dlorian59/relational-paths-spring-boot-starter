# Bounds constrain metadata traversal; they never silently truncate a report.
# Лимиты ограничивают обход метаданных; они никогда не обрезают отчёт незаметно.
relational-paths.max-tables=32
relational-paths.max-relationships=64
relational-paths.max-edge-visits=64
spring.main.banner-mode=off
logging.level.root=WARN
